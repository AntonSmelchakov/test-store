services:
  mysql:
    image: mysql:8.0
    container_name: test-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:${DB_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
